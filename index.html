<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태극 타깃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  :root { --ink: #22263a; --ink2: #5b627f; --ink3: #9aa1bf; --pink: #ff7aa2; --orange: #ff9a62; }
  html, body { margin: 0; height: 100%; background: #f7f8fc; color: var(--ink); overflow: hidden;
    font-family: "Nunito", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  #stage { position: fixed; inset: 0; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #panel { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; z-index: 9; opacity: 0.25; transition: opacity .2s; }
  #panel:hover { opacity: 1; }
  #panel button { font: 800 13px "Noto Sans KR", sans-serif; background: rgba(255,255,255,0.9); color: var(--ink2); border: 1px solid #e3e8f2; border-radius: 10px; padding: 6px 10px; cursor: pointer; }
  #panel button:focus-visible { outline: 2px solid var(--pink); }
  #hint { position: fixed; right: 14px; top: 12px; font-size: 12px; font-weight: 700; color: var(--ink3); z-index: 9; opacity: 0.6; text-align: right; line-height: 1.5; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(255,255,255,0.92); color: var(--ink2); font-weight: 700; font-size: 15px; padding: 10px 18px; border-radius: 20px; box-shadow: 0 12px 30px rgba(60,80,120,0.18); z-index: 9; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: 1; }

  /* ── 시작 화면 (A 시안: 글래스 파스텔 + 품세 카드 4×2) ── */
  .screen { position: fixed; inset: 0; z-index: 5; display: none; overflow: hidden; }
  .screen.on { display: block; }
  #start { background: radial-gradient(circle at 15% 20%, #ffd6e8 0%, transparent 45%), radial-gradient(circle at 85% 15%, #d8e6ff 0%, transparent 45%), radial-gradient(circle at 60% 90%, #d9fff0 0%, transparent 50%), #f7f8fc; }
  #start.cam { background: rgba(247,248,252,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .brand { position: absolute; left: 0; right: 0; top: 7vh; margin: 0; display: flex; align-items: center; justify-content: center; gap: clamp(12px, 1.6vw, 28px); font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: clamp(22px, 3.4vw, 56px); letter-spacing: -0.5px; color: var(--ink); }
  .brand img { height: clamp(44px, min(7vw, 12vh), 120px); width: auto; display: block; }
  .cards { position: absolute; left: 5vw; right: 5vw; top: 26vh; bottom: 20vh; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 3vh 3vw; }
  .card { position: relative; border-radius: clamp(14px, 2.2vw, 36px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6vw; padding: 0; border: 0.15vw solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.55); color: #b4b9cf; box-shadow: 0 1vw 2.6vw rgba(60,80,120,0.08); font-family: "Noto Sans KR", sans-serif; font-weight: 800; font-size: clamp(18px, 2.6vw, 44px); text-align: center; cursor: default; }
  .card .chip { font-size: clamp(10px, 1.15vw, 18px); font-weight: 700; letter-spacing: 1px; padding: 0.35vw 1vw; border-radius: 999px; margin-top: 0.6vw; background: rgba(90,98,130,0.08); color: #9aa1bf; }
  .card.on { cursor: pointer; background: linear-gradient(135deg, var(--pink), var(--orange)); color: #fff; box-shadow: 0 1.8vw 4vw rgba(255,122,162,0.45); }
  .card.on .chip { background: rgba(255,255,255,0.28); color: #fff; }
  .card.on:focus-visible { outline: 0.4vw solid var(--ink); outline-offset: 0.4vw; }
  .card.on.wait { filter: saturate(0.45); }
  .sub { position: absolute; left: 0; right: 0; bottom: 11vh; text-align: center; font-size: clamp(14px, 1.7vw, 24px); font-weight: 800; color: var(--ink2); }
  .err { position: absolute; left: 10vw; right: 10vw; bottom: 5vh; text-align: center; font-size: clamp(12px, 1.3vw, 16px); font-weight: 700; color: #e0506e; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted hidden></video>
  <canvas id="c"></canvas>
</div>
<div id="panel">
  <button id="bCam">카메라 켜기</button>
  <button id="bPlay">▶ 시작</button>
  <button id="bVoice">구령 켜짐</button>
</div>
<div id="hint">리모컨 ▶ 또는 Space: 시작 · 숫자 1~8: 품세 바로 시작 · V: 구령</div>
<div id="toast"></div>

<div id="start" class="screen">
  <h1 class="brand"><img src="assets/logo-playcon.png" alt="PLAYCON"><span>태권도 품세 연습</span></h1>
  <div class="cards">
    <button class="card on" type="button" data-course="0"><span>태극 1장</span><span class="chip">누르면 시작</span></button>
    <button class="card on" type="button" data-course="1"><span>태극 2장</span><span class="chip">누르면 시작</span></button>
    <button class="card on" type="button" data-course="2"><span>태극 3장</span><span class="chip">누르면 시작</span></button>
    <button class="card on" type="button" data-course="3"><span>태극 4장</span><span class="chip">누르면 시작</span></button>
    <button class="card on" type="button" data-course="4"><span>태극 5장</span><span class="chip">누르면 시작</span></button>
    <button class="card on" type="button" data-course="5"><span>태극 6장</span><span class="chip">누르면 시작</span></button>
    <button class="card on" type="button" data-course="6"><span>태극 7장</span><span class="chip">누르면 시작</span></button>
    <button class="card on" type="button" data-course="7"><span>태극 8장</span><span class="chip">누르면 시작</span></button>
  </div>
  <div id="startSub" class="sub">품세를 누르면 카메라가 켜지고 바로 시작합니다 · 4명까지</div>
  <div id="startErr" class="err"></div>
</div>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   태극 타깃 — 동작 목업
   타깃이 뜨면 맞는 높이로 친다. 판정은 "닿았는가" 하나.
   ═══════════════════════════════════════════════════════════ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
const toastEl = document.getElementById('toast');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

function toast(msg, ms = 2500) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('on'), ms);
}

/* ── 타깃 종류: 높이 4가지 ──────────────────────────────── */
/* ── 타깃 종류(기술) 표 ──────────────────────────────────
   part: 판정에 쓰는 몸 부위 wrist(손목) | ankle(발목·발끝) | elbow(팔꿈치) | knee(무릎)
   spot(a, s): 타깃 위치 {x, y, r}. two(a, s): 양손 기술 — 두 자리를 각각 다른 손이 채워야 성공
   kick: 'front'(무릎 높이 이상, 몸 앞) | 'side'(높이 이상, 몸 옆으로) | 'jump'(front + 반대 발도 바닥에서 떨어짐)
   fromOutside: 손이 어깨 폭 바깥을 거쳐 옆으로 들어와야 인정(안치기·안막기류)   fromAbove: 손이 머리 높이를 거쳐 내려와야 인정(내려치기)
   s = 왼쪽(-1)/오른쪽(+1). 화면 좌표라 숫자는 어깨 폭(sw) 배수. */
const HL = () => (COURSES[G.course].highLift || 0.25);
const KIND = {
  // 태극 1장
  low:   { label: '아래',   voice: '아래막기',   color: '#2fd38a', dark: '#0b3d25', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.95, y: a.hipY + (a.kneeY - a.hipY) * 0.35, r: a.sw * 0.5 }) },
  mid:   { label: '몸통',   voice: '몸통지르기', color: '#ffb347', dark: '#5a3200', part: 'wrist', spot: (a, s) => ({ x: a.cx, y: a.chestY, r: a.sw * 0.5 }) },
  high:  { label: '얼굴',   voice: '얼굴막기',   color: '#ff7aa2', dark: '#5c1030', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.15, y: a.headY - a.sw * HL(), r: a.sw * (HL() > 0.3 ? 0.45 : 0.5) }) },
  kick:  { label: '차기',   voice: '앞차기',     color: '#6fb1ff', dark: '#0d2f66', part: 'ankle', kick: 'front', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.3, y: a.kneeY - a.sw * 0.15, r: a.sw * 0.6 }) },
  inblock: { label: '안막기', voice: '몸통안막기', color: '#5fd6a5', dark: '#0c4a33', part: 'wrist', fromOutside: true, spot: (a, s) => ({ x: a.cx + s * a.sw * 0.15, y: a.chestY, r: a.sw * 0.45 }) },
  // 태극 2장
  face:  { label: '지르기', voice: '얼굴지르기', color: '#b79bff', dark: '#2e1a66', part: 'wrist', spot: (a, s) => ({ x: a.cx, y: a.headY + a.sw * 0.08, r: a.sw * 0.4 }) },
  // 태극 3장
  kblock: { label: '손날막기', voice: '손날바깥막기', color: '#3fd0c9', dark: '#0b4442', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.95, y: a.shoulderY, r: a.sw * 0.45 }) },
  kin:    { label: '손날치기', voice: '손날안치기',   color: '#ff8fd0', dark: '#5a1a45', part: 'wrist', fromOutside: true, spot: (a, s) => ({ x: a.cx, y: a.shoulderY - a.sw * 0.28, r: a.sw * 0.38 }) },
  // 태극 4장
  augkblock: { label: '거들어막기', voice: '손날거들어바깥막기', color: '#3fd0c9', dark: '#0b4442', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.9, y: a.chestY, r: a.sw * 0.45 }) },
  spear:   { label: '찌르기',   voice: '세워찌르기',   color: '#ffc46b', dark: '#5a3200', part: 'wrist', spot: (a, s) => ({ x: a.cx, y: a.chestY - a.sw * 0.15, r: a.sw * 0.42 }) },
  swallow: { label: '제비품',   voice: '제비품안치기', color: '#ff8fd0', dark: '#5a1a45', part: 'wrist', fromOutside: true, spot: (a, s) => ({ x: a.cx, y: a.shoulderY - a.sw * 0.28, r: a.sw * 0.38 }) },
  sidekick: { label: '옆차기',  voice: '옆차기',       color: '#6fb1ff', dark: '#0d2f66', part: 'ankle', kick: 'side', spot: (a, s) => ({ x: a.cx + s * a.sw * 1.1, y: a.hipY, r: a.sw * 0.6 }) },
  outblock: { label: '바깥막기', voice: '몸통바깥막기', color: '#5fd6a5', dark: '#0c4a33', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.9, y: a.chestY + a.sw * 0.1, r: a.sw * 0.45 }) },
  backfist: { label: '등주먹',  voice: '등주먹앞치기', color: '#b79bff', dark: '#2e1a66', part: 'wrist', spot: (a, s) => ({ x: a.cx, y: a.headY + a.sw * 0.1, r: a.sw * 0.4 }) },
  // 태극 5장
  hammer:   { label: '메주먹',  voice: '메주먹내려치기', color: '#ff9a62', dark: '#5a2a00', part: 'wrist', fromAbove: true, spot: (a, s) => ({ x: a.cx + s * a.sw * 0.25, y: a.chestY, r: a.sw * 0.45 }) },
  elbowTurn: { label: '팔꿈치', voice: '팔꿈치돌려치기', color: '#ff7a7a', dark: '#5a1010', part: 'elbow', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.15, y: a.headY + a.sw * 0.4, r: a.sw * 0.45 }) },
  elbowTarget: { label: '표적치기', voice: '팔꿈치표적치기', color: '#ff7a7a', dark: '#5a1010', part: 'elbow', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.2, y: a.chestY, r: a.sw * 0.45 }) },
  // 태극 6장
  twistblock: { label: '비틀어막기', voice: '손날비틀어바깥막기', color: '#3fd0c9', dark: '#0b4442', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.9, y: a.headY + a.sw * 0.15, r: a.sw * 0.42 }) },
  faceout:  { label: '얼굴바깥', voice: '얼굴바깥막기', color: '#ff7aa2', dark: '#5c1030', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.9, y: a.headY + a.sw * 0.15, r: a.sw * 0.42 }) },
  spreadLow: { label: '헤쳐막기', voice: '아래헤쳐막기', color: '#9fd65f', dark: '#2f4a0c', part: 'wrist', two: (a, s) => [{ x: a.cx - a.sw * 0.9, y: a.hipY + a.sw * 0.25, r: a.sw * 0.42 }, { x: a.cx + a.sw * 0.9, y: a.hipY + a.sw * 0.25, r: a.sw * 0.42 }] },
  palm:     { label: '바탕손',  voice: '바탕손안막기', color: '#5fd6a5', dark: '#0c4a33', part: 'wrist', fromOutside: true, spot: (a, s) => ({ x: a.cx + s * a.sw * 0.15, y: a.chestY, r: a.sw * 0.42 }) },
  roundkick: { label: '돌려차기', voice: '돌려차기',   color: '#6fb1ff', dark: '#0d2f66', part: 'ankle', kick: 'side', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.8, y: a.shoulderY + a.sw * 0.1, r: a.sw * 0.6 }) },
  // 태극 7장
  augLow:   { label: '손날아래', voice: '손날거들어아래막기', color: '#2fd38a', dark: '#0b3d25', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.95, y: a.hipY + (a.kneeY - a.hipY) * 0.35, r: a.sw * 0.5 }) },
  augPalm:  { label: '바탕손',  voice: '바탕손거들어안막기', color: '#5fd6a5', dark: '#0c4a33', part: 'wrist', fromOutside: true, spot: (a, s) => ({ x: a.cx + s * a.sw * 0.15, y: a.chestY, r: a.sw * 0.42 }) },
  augBackfist: { label: '등주먹', voice: '등주먹거들어앞치기', color: '#b79bff', dark: '#2e1a66', part: 'wrist', spot: (a, s) => ({ x: a.cx, y: a.headY + a.sw * 0.1, r: a.sw * 0.4 }) },
  scissor:  { label: '가위막기', voice: '가위막기',     color: '#9fd65f', dark: '#2f4a0c', part: 'wrist', two: (a, s) => [{ x: a.cx + s * a.sw * 0.9, y: a.hipY + a.sw * 0.2, r: a.sw * 0.42 }, { x: a.cx - s * a.sw * 0.2, y: a.chestY, r: a.sw * 0.42 }] },
  spread:   { label: '헤쳐막기', voice: '헤쳐막기',     color: '#9fd65f', dark: '#2f4a0c', part: 'wrist', two: (a, s) => [{ x: a.cx - a.sw * 0.9, y: a.chestY, r: a.sw * 0.42 }, { x: a.cx + a.sw * 0.9, y: a.chestY, r: a.sw * 0.42 }] },
  knee:     { label: '무릎치기', voice: '무릎올려치기', color: '#6fb1ff', dark: '#0d2f66', part: 'knee', kick: 'front', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.25, y: a.hipY - a.sw * 0.1, r: a.sw * 0.5 }) },
  twinpunch: { label: '젖혀지르기', voice: '젖혀지르기', color: '#ffb347', dark: '#5a3200', part: 'wrist', two: (a, s) => [{ x: a.cx - a.sw * 0.3, y: a.bellyY, r: a.sw * 0.4 }, { x: a.cx + a.sw * 0.3, y: a.bellyY, r: a.sw * 0.4 }] },
  xlow:     { label: '엇걸어막기', voice: '엇걸어아래막기', color: '#9fd65f', dark: '#2f4a0c', part: 'wrist', two: (a, s) => [{ x: a.cx - a.sw * 0.18, y: a.hipY + a.sw * 0.3, r: a.sw * 0.4 }, { x: a.cx + a.sw * 0.18, y: a.hipY + a.sw * 0.3, r: a.sw * 0.4 }] },
  backfistOut: { label: '바깥치기', voice: '등주먹바깥치기', color: '#b79bff', dark: '#2e1a66', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 1.0, y: a.headY + a.sw * 0.2, r: a.sw * 0.42 }) },
  sideblock: { label: '옆막기',  voice: '손날옆막기',   color: '#3fd0c9', dark: '#0b4442', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.95, y: a.chestY, r: a.sw * 0.42 }) },
  sidepunch: { label: '옆지르기', voice: '옆지르기',     color: '#ffb347', dark: '#5a3200', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 1.35, y: a.chestY, r: a.sw * 0.42 }) },
  targetKick: { label: '표적차기', voice: '표적차기',   color: '#6fb1ff', dark: '#0d2f66', part: 'ankle', kick: 'front', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.2, y: a.chestY + a.sw * 0.2, r: a.sw * 0.6 }) },
  // 태극 8장
  augOut:   { label: '거들어막기', voice: '거들어바깥막기', color: '#5fd6a5', dark: '#0c4a33', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.9, y: a.chestY + a.sw * 0.1, r: a.sw * 0.45 }) },
  jumpkick: { label: '두발당성', voice: '두발당성앞차기', color: '#6fb1ff', dark: '#0d2f66', part: 'ankle', kick: 'jump', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.3, y: a.hipY, r: a.sw * 0.6 }) },
  flykick:  { label: '뛰어차기', voice: '뛰어앞차기',   color: '#6fb1ff', dark: '#0d2f66', part: 'ankle', kick: 'jump', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.3, y: a.hipY - a.sw * 0.1, r: a.sw * 0.6 }) },
  wblock:   { label: '외산틀',  voice: '외산틀막기',   color: '#9fd65f', dark: '#2f4a0c', part: 'wrist', two: (a, s) => [{ x: a.cx + s * a.sw * 0.9, y: a.headY + a.sw * 0.15, r: a.sw * 0.42 }, { x: a.cx - s * a.sw * 0.9, y: a.hipY + a.sw * 0.2, r: a.sw * 0.42 }] },
  pullpunch: { label: '당겨지르기', voice: '당겨지르기', color: '#ffb347', dark: '#5a3200', part: 'wrist', spot: (a, s) => ({ x: a.cx, y: a.chestY, r: a.sw * 0.5 }) },
  augLowBlock: { label: '거들어아래', voice: '아래거들어막기', color: '#2fd38a', dark: '#0b3d25', part: 'wrist', spot: (a, s) => ({ x: a.cx + s * a.sw * 0.95, y: a.hipY + (a.kneeY - a.hipY) * 0.35, r: a.sw * 0.5 }) },
};
function targetSpots(a, k, side) { const kind = KIND[k], s = side === 'L' ? -1 : 1; return kind.two ? kind.two(a, s) : [kind.spot(a, s)]; }
function targetPos(a, k, side) { return targetSpots(a, k, side)[0]; }

/* ── 소리·구령 ──────────────────────────────────────────── */
let audio = null;
function beep(freq, dur = 0.12, type = 'sine', gain = 0.25) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch (e) { /* 소리 없어도 게임은 돈다 */ }
}
const sfx = {
  spawn: () => beep(660, 0.08, 'triangle', 0.12),
  kick:  () => beep(740, 0.09, 'square', 0.16),
  hit:   () => { beep(880, 0.12, 'square', 0.18); setTimeout(() => beep(1320, 0.16, 'square', 0.14), 60); },
  start: () => { beep(523, 0.1); setTimeout(() => beep(659, 0.1), 120); setTimeout(() => beep(784, 0.2), 240); },
  end:   () => { beep(784, 0.15); setTimeout(() => beep(1047, 0.35), 160); },
  tick:  () => beep(440, 0.05, 'sine', 0.1),
};
let voiceOn = true;
function say(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 1.15; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) { /* 무시 */ }
}

/* ── 몸 기준점 (카메라 랜드마크에서 계산) ────────────────
   { cx, sw, headY, chestY, hipY, kneeY, wrists:[{x,y}], ankles:[{x,y}] } */

/* ── 타깃 만들기·판정: 모두 같은 동작을 같은 순간에 ──────
   타깃은 한 번에 하나(G.cur)만 뜨고, 참가자 전원이 같은 종류·같은 쪽을 받는다.
   판정과 점수만 사람별로 따로 한다. */
function newTarget(task) {   // 과제 → 사람별 타깃 (steps: 박자 순서, idx: 지금 맞혀야 할 박자)
  const steps = task.steps || [task];
  return { steps, name: task.steps ? task.name : null, idx: 0, hits: [], gains: [], used: [], side: G.side, born: G.now, window: G.window, hit: 0, blocked: null, outside: null };
}
function spawnShared(task, dir) {
  G.side = G.side === 'L' ? 'R' : 'L';
  const steps = task.steps || [task];
  const win = Math.round(G.window * (1 + 0.6 * (steps.length - 1)));   // 박자가 늘면 시간도 늘린다
  G.cur = { task, steps, name: task.steps ? task.name : null, side: G.side, dir, born: G.now, window: win, done: false };
  for (const p of G.players) { p.target = newTarget(task); p.target.window = win; p.shown += steps.length; }
  sfx.spawn(); say(G.cur.name || KIND[steps[0]].voice);
}
function joinCurrent(p) {   // 라운드 중간에 들어온 사람도 지금 타깃을 같이 받는다
  const c = G.cur; if (!c || c.done) return;
  p.target = newTarget(c.task); p.target.born = c.born; p.target.window = c.window; p.shown += c.steps.length;
}

function updateTargets() {
  const c = COURSES[G.course];
  if (!G.cur) {
    if (G.now - G.lastEnd > 650) {
      if (c.seq) {
        if (G.seqIndex >= c.seq.length) return;
        const [dir, kind] = c.seq[G.seqIndex]; spawnShared(kind, dir);
      } else {
        spawnShared(c.next(G.lastKind), null);
      }
      G.lastKind = taskKey(G.cur.task);
    }
    return;
  }
  const cur = G.cur, age = G.now - cur.born;
  const everyoneHit = G.players.length > 0 && G.players.every(p => p.target && p.target.hit);
  if (!cur.done && (age > 500 + cur.window || everyoneHit)) {
    cur.done = true; cur.doneAt = G.now;
    const missed = G.players.filter(p => !p.target || !p.target.hit).length;
    G.window = missed ? Math.min(3000, G.window + 300) : Math.max(1400, G.window - 150);   // 반이 놓치면 느리게, 다 맞히면 빠르게
    for (const p of G.players) if (!p.target || !p.target.hit) p.streak = 0;
  }
  if (cur.done) {
    if (G.now - cur.doneAt > 450) { G.cur = null; G.lastEnd = G.now; for (const p of G.players) p.target = null; if (c.seq) G.seqIndex++; }
    return;
  }
  if (age < 350) return;            // 나타나는 중에는 판정 안 함
  for (const p of G.players) {
    const t = p.target; if (!t || t.hit) continue;
    const a = p.anchors; if (!a) continue;
    const k = t.steps[t.idx], kind = KIND[k];
    const spots = targetSpots(a, k, t.side), pos = spots[0];
    const parts = partsOf(a, kind.part);
    const inside = (pt, sp) => !!pt && Math.hypot(pt.x - sp.x, pt.y - sp.y) < sp.r;
    let hitIdx = -1;
    if (kind.two) {
      // 양손 기술: 두 자리를 서로 다른 손이 동시에 채워야 한다. 켜질 때 이미 채워져 있었으면 한 번 풀었다가 다시 해야 인정
      const w = a.wrists, ok = (inside(w[0], spots[0]) && inside(w[1], spots[1])) || (inside(w[0], spots[1]) && inside(w[1], spots[0]));
      if (t.blocked === null) t.blocked = ok;
      if (t.blocked) { if (!ok) t.blocked = false; }
      else if (ok) hitIdx = 0;
    } else {
      // 박자가 켜지는 순간 이미 타깃 안에 있던 손·발은 한 번 빠져나갔다 들어와야 인정 (겨룸새로 가슴 앞에 둔 손 등)
      if (!t.blocked) t.blocked = parts.map(pt => inside(pt, pos));
      if ((kind.fromOutside || kind.fromAbove) && !t.outside) t.outside = parts.map(() => false);
      for (let i = 0; i < parts.length; i++) {
        const pt = parts[i]; if (!pt) continue;
        const d = Math.hypot(pt.x - pos.x, pt.y - pos.y);
        if (t.blocked[i]) { if (d > pos.r * 1.15) t.blocked[i] = false; continue; }
        if (kind.fromOutside) {   // 안치기·안막기: 손이 어깨 폭 바깥에서 옆으로 들어와야 한다 (아래에서 올라오는 지르기와 구분)
          if (Math.abs(pt.x - a.cx) > a.sw * 0.8) t.outside[i] = true;
          if (!t.outside[i]) continue;
        }
        if (kind.fromAbove) {     // 내려치기: 손이 머리 높이를 거쳐 내려와야 한다
          if (pt.y < a.headY + a.sw * 0.2) t.outside[i] = true;
          if (!t.outside[i]) continue;
        }
        // 같은 손 기술 연속(두 번 지르기)은 반대 손이어야 한다. 발은 같은 발 연속(옆차기 두 번)이 정상이라 제한 없음
        if (kind.part === 'wrist' && t.idx > 0 && t.steps[t.idx - 1] === k && t.used[t.idx - 1] === i) continue;
        let ok;
        if (kind.kick) {
          // 차기: 발이 타깃 높이까지 올라오면 성공. 정면 카메라에선 앞차기 발이 카메라 쪽으로 나가 좌우가 애매하므로 높이 위주로 본다
          const highEnough = pt.y <= pos.y + pos.r * 0.5;
          if (kind.kick === 'side') ok = highEnough && Math.abs(pt.x - a.cx) > a.sw * 0.45;                 // 옆차기·돌려차기: 몸 옆으로
          else if (kind.kick === 'jump') {                                                                    // 뛰어 차기: 반대 발도 바닥에서 떨어져야
            const other = a.ankles[(i % 2 === 0) ? 1 : 0], shin = a.kneeY - a.hipY;
            ok = highEnough && Math.abs(pt.x - a.cx) < a.sw * 1.3 && !!other && other.y < a.kneeY + shin * 0.55;
          } else ok = highEnough && Math.abs(pt.x - a.cx) < a.sw * 1.3;
          ok = ok || d < pos.r;
        } else ok = d < pos.r;
        if (ok) { hitIdx = i; break; }
      }
    }
    if (hitIdx < 0) continue;
    const last = t.idx === t.steps.length - 1;
    const gain = 10 + Math.min(p.streak, 5) * 2 + (last && t.steps.length > 1 ? 10 * (t.steps.length - 1) : 0);   // 마지막 박자에 연결 보너스
    p.hits++; p.streak++; p.score += gain;
    t.hits[t.idx] = G.now; t.gains[t.idx] = gain; t.used[t.idx] = hitIdx;
    for (const sp of spots) burst(sp.x, sp.y, kind.color);
    if (last) { t.hit = G.now; t.gain = gain; sfx.hit(); }
    else { sfx.kick(); t.idx++; t.blocked = null; t.outside = null; }   // 다음 박자가 즉시 켜진다
  }
}

function burst(x, y, color) {
  const palette = [color, PINK, ORANGE, '#6fb1ff', '#ffd166', '#2fd38a'];
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2, v = 160 + Math.random() * 300;
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 1, color: palette[i % palette.length], rot: Math.random() * 6, w: 10 + Math.random() * 8 });
  }
}

/* ── 라운드 흐름 ───────────────────────────────────────── */
function startRound() {
  if (G.mode === 'none') { G.armed = true; startCamera(); return; }
  if (!G.players.length) { toast('카메라 앞 칸에 서면 참가됩니다'); return; }
  G.armed = false;
  const c = COURSES[G.course];
  for (const p of G.players) Object.assign(p, { score: 0, hits: 0, shown: 0, streak: 0, target: null });
  G.seqIndex = 0; G.cur = null; G.window = 2400; G.lastEnd = G.now + 900; G.lastKind = null;
  G.state = 'play'; G.tStart = G.now;
  G.tEnd = c.seconds ? G.now + c.seconds * 1000 : 0;
  sfx.start(); say(c.name + ' 시작');
}
function endRound() {
  G.state = 'result'; G.resultAt = G.now; G.cur = null;
  for (const p of G.players) p.target = null;
  sfx.end();
  const best = G.players.reduce((m, p) => Math.max(m, stars(p)), 0);
  say(best >= 3 ? '아주 잘했습니다' : '잘했어요');
}
function stars(p) { if (!p.shown) return 0; const r = p.hits / p.shown; return r >= 0.8 ? 3 : r >= 0.5 ? 2 : 1; }
function changeCourse() { /* 코스는 하나뿐 */ }
function pressPlay() {
  if (G.state === 'play') { G.state = 'attract'; G.armed = false; G.cur = null; for (const p of G.players) p.target = null; say('정지'); return; }
  if (G.state === 'attract') pickCard();
}

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'Enter' || k === 'PageDown') { e.preventDefault(); pressPlay(); }

  else if (/^[1-9]$/.test(k) && COURSES[+k - 1]) { e.preventDefault(); pickCard(+k - 1); }   // 숫자 키: 그 품세를 바로 시작
  else if (k === 'v' || k === 'V') toggleVoice();
});

/* 품세 카드: 누르면 카메라를 켜고, 사람이 보이는 순간 바로 시작한다 */
function pickCard(i = G.course) {
  if (G.state !== 'attract') return;
  G.course = i; G.armed = true; G.camError = null;

    video.srcObject = stream; video.hidden = false;

    await new Promise((res) => video.addEventListener('loadedmetadata', res, { once: true }));
    toast('자세 인식 프로그램을 내려받는 중 (처음 한 번, 5~15초)', 6000);

    const fileset = await mp.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');

/* ── 플레이어 목록 갱신 (칸은 화면 왼쪽부터) ─────────── */
function syncPlayers() {
  let list = [];
  if (G.mode === 'camera') {
    const res = readPoses();
    if (res) {
      // 어깨·엉덩이가 또렷이 보이는 사람만 (옷걸이·의자 오인식 방지)
      const solid = res.landmarks.filter(lm => [11, 12].every(i => lm[i] && (lm[i].visibility ?? 1) > 0.6) && [23, 24].every(i => lm[i] && (lm[i].visibility ?? 1) > 0.45));

      // 이전 프레임과 가까운 사람끼리 id를 잇는다
      const used = new Set();
      for (const a of seen) {
        let best = null, bd = 1e9;
        for (const t of tracked) { if (used.has(t.id)) continue; const d = Math.abs(t.cx - a.cx); if (d < bd && d < a.sw * 3) { bd = d; best = t; } }
        if (!best) { best = { id: Math.random().toString(36).slice(2), firstSeen: G.now }; tracked.push(best); }
        used.add(best.id); best.cx = a.cx; best.lastSeen = G.now; best.anchors = a;
      }
    }
    for (let i = tracked.length - 1; i >= 0; i--) if (G.now - tracked[i].lastSeen > 1500) tracked.splice(i, 1);

    list = tracked.filter(t => G.now - t.firstSeen > 500).sort((a, b) => a.cx - b.cx).slice(0, 4).map(t => ({ id: t.id, anchors: t.anchors }));
  }
  // 기존 플레이어 객체 유지 (점수 보존)
  const byId = new Map(G.players.map(p => [p.id, p]));
  G.players = list.map((e, i) => {
    let p = byId.get(e.id);
    if (!p) { p = { id: e.id, score: 0, hits: 0, shown: 0, streak: 0, target: null }; if (G.state === 'play') joinCurrent(p); }
    p.anchors = e.anchors; p.color = LANE_COLORS[i % 4];

  });
}

function drawPlayerMark(p) {

  // 우측 콤보 (2연속부터): 그라디언트 큰 숫자 + 흰 필
  const best = G.players.reduce((m, p) => Math.max(m, p.streak || 0), 0);
  if (best >= 2) {
    gradText('×' + best, W - u * 0.05, u * 0.24, Math.round(u * 0.15), PINK, ORANGE);
    const fs = Math.round(u * 0.02); ctx.font = `900 ${fs}px ${FONT_KO}`; const tw = ctx.measureText('콤보!').width + fs * 1.6;
    glassBox(W - u * 0.05 - tw, u * 0.34, tw, fs * 1.9, fs, 0.95);
    txt('콤보!', W - u * 0.05 - tw / 2, u * 0.34 + fs * 0.95, fs, { color: PINK });
  }
  // 하단 코칭 필
  const t0 = (G.cur && !G.cur.done) ? G.cur : null;
  if (t0) {
    const fs = Math.round(u * 0.06); ctx.font = `900 ${fs}px ${FONT_KO}`;
    const label = t0.name || KIND[t0.steps[0]].voice, tw = ctx.measureText(label + ' !').width + fs * 1.6;
    const x = W / 2 - tw / 2, y = H - u * 0.055 - fs;
    glassBox(x, y, tw, fs * 1.55, fs * 0.78, 0.86);
    txt(label, W / 2 - fs * 0.3, y + fs * 0.8, fs, { color: INK });
    txt('!', W / 2 + ctx.measureText(label).width / 2 + fs * 0.1, y + fs * 0.8, fs, { color: KIND[t0.steps[t0.steps.length - 1]].color });
  }
}

function drawResult() {
  const u = U();
  ctx.fillStyle = 'rgba(247,248,252,0.6)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W * 0.72, u * 1.3), ph = u * 0.62, px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  glassBox(px, py, pw, ph, 32, 0.86);
  txt('잘했어요!', W / 2, py + ph * 0.17, Math.round(u * 0.08), { color: INK });
  const n = G.players.length, colW = pw / Math.max(n, 1);
  G.players.forEach((p, i) => {
    const x = px + colW * (i + 0.5), s = stars(p);
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, py + ph * 0.36, u * 0.016, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 3; k++) {
      const hx = x + (k - 1) * u * 0.075, hy = py + ph * 0.52, rr = u * 0.028;
      if (k < s) { const g = ctx.createRadialGradient(hx - rr * 0.3, hy - rr * 0.3, 1, hx, hy, rr); g.addColorStop(0, '#fff6c8'); g.addColorStop(1, '#ffb347'); shadow('rgba(255,179,71,0.5)', 16, 6); ctx.fillStyle = g; }
      else { ctx.fillStyle = '#eceff6'; }
      ctx.beginPath(); ctx.arc(hx, hy, rr, 0, Math.PI * 2); ctx.fill(); noShadow();
    }
    txt(p.score, x, py + ph * 0.72, Math.round(u * 0.075), { font: FONT_NUM, color: INK });
    txt(`${p.hits} / ${p.shown}`, x, py + ph * 0.84, Math.round(u * 0.02), { font: FONT_NUM, color: INK3, weight: 800 });
  });
  const left = Math.ceil((G.resultAt + 8000 - G.now) / 1000);
  txt(`${left}초 후 다음 조`, W / 2, py + ph + u * 0.05, Math.round(u * 0.022), { color: INK3, weight: 800 });
}

/* ── 메인 루프 ──────────────────────────────────────────── */
let lastTickSec = -1;
function loop(ts) {
  G.now = ts;
  try { syncPlayers(); } catch (e) { console.error('[인식 오류]', e); }
  if (G.state === 'play') {
    try { updateTargets(); } catch (e) { console.error('[판정 오류]', e); }
    const c = COURSES[G.course];
    if (c.seq) {
      if (G.seqIndex >= c.seq.length && !G.cur) endRound();
    } else {
      const left = (G.tEnd - G.now) / 1000;
      const sec = Math.ceil(left);
      if (sec <= 5 && sec !== lastTickSec && sec > 0) { lastTickSec = sec; sfx.tick(); }
      if (left <= 0) endRound();
    }
  } else if (G.state === 'attract' && G.armed && G.mode === 'camera' && G.players.length) {
    startRound();
  } else if (G.state === 'result' && G.now - G.resultAt > 8000) {
    G.state = 'attract';
  }
  try { syncScreens(); } catch (e) { console.error('[화면 오류]', e); }
  try { draw(); } catch (e) { console.error('[그리기 오류]', e); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 처음엔 아무것도 혼자 시작하지 않는다. 카메라 켜기를 누르면 시작. */
</script>
